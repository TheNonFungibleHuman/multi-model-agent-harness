# FULL profile - design MCP ON, broader skill catalog.
# Apply: powershell -File $env:USERPROFILE\.grok\switch-profile.ps1 full

[cli]
installer = "internal"

[ui]
max_thoughts_width = 120
yolo = false
compact_mode = false
permission_mode = "always-approve"
theme = "oscura-midnight"

[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[plugins]
enabled = []

[models]
default = "deepseek-flash-high"
# Seats self-declare effort (deepseek-flash low, deepseek-flash-high high). This
# key is tuner-owned: token-ledger/tuner.py lowers it when reasoning burns hot.
default_reasoning_effort = "medium"
web_search = "deepseek-flash"
# xAI-hosted grok seats are retired here (Grok Build balance exhausted, 402).
# Hidden from the picker; -m can still select them after a balance top-up.
hidden_models = ["grok-4.5", "grok-4.6"]

[features]
web_fetch = true

[session]
auto_compact_threshold_percent = 85

[compaction.pruning]
# Tool results dominate context on tool-heavy sessions and are re-runnable, so
# trim them earlier than the stock defaults (4000 chars / 10 turns).
keep_last_n_turns = 2
soft_trim_threshold = 2000
soft_trim_head = 700
soft_trim_tail = 700
hard_clear_age_turns = 6

[model.deepseek-flash]
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
supports_backend_search = true
name = "DeepSeek V4.1 Flash"
description = "Native multimodal V4.1 Flash (direct api.deepseek.com). Sees images in user messages. No strip-proxy."
env_key = "DEEPSEEK_API_KEY"
api_backend = "chat_completions"
context_window = 500000
max_completion_tokens = 8192
supports_reasoning_effort = true
reasoning_effort = "low"

[model.deepseek-flash-high]
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
supports_backend_search = true
name = "DeepSeek V4.1 Flash (High effort)"
description = "Same V4.1 Flash, higher reasoning effort. Direct api.deepseek.com."
env_key = "DEEPSEEK_API_KEY"
api_backend = "chat_completions"
context_window = 500000
max_completion_tokens = 16384
supports_reasoning_effort = true
reasoning_effort = "high"

[model.deepseek-pro]
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
supports_backend_search = true
name = "DeepSeek V4.1 Pro"
description = "Text-only V4.1 Pro (1.6T MoE): judgment, planning, hard bugs, review. Direct api.deepseek.com."
env_key = "DEEPSEEK_API_KEY"
api_backend = "chat_completions"
context_window = 500000
max_completion_tokens = 16384
supports_reasoning_effort = true
reasoning_effort = "high"

[model.glm-flash]
model = "glm-5.3-flash"
base_url = "https://api.z.ai/api/paas/v4"
name = "GLM 5.3 Flash (Z.ai PAYG)"
description = "Z.ai direct GLM 5.3 Flash: 1M context, reasoning always on at low effort. Bulk/overflow seat on the PAYG plan."
env_key = "ZAI_API_KEY"
api_backend = "chat_completions"
context_window = 500000
max_completion_tokens = 8192
supports_reasoning_effort = true
reasoning_effort = "low"

[subagents]
enabled = true

[subagents.models]
explore = "deepseek-flash"
plan = "deepseek-pro"

# Personas are prompt overlays (TUI /personas or subagent resolution); they do
# not create spawnable subagent types. Spawn types: explore, general-purpose, plan.
[subagents.personas.reviewer]
description = "High-judgment code/spec review and nasty-bug analysis on DeepSeek V4.1 Pro"
model = "deepseek-pro"
reasoning_effort = "high"
instructions = """
You are the senior reviewer on DeepSeek V4.1 Pro: judgment for a Flash implementer parent.

Use for: code/spec review, nasty/hard/flaky bugs, security, architecture calls.
Be concise. Cite file paths. Prefer actionable findings over praise.

If reviewing: return summary, blockers, nits, go/no-go.
If debugging: return ranked root-cause hypotheses, evidence steps, minimal fix plan, risks.
Do not dump huge rewrites — hand the parent a clear plan they can execute.
"""

[subagents.personas.planner]
description = "Architecture and implementation planning on DeepSeek V4.1 Pro (Flash implements after)"
model = "deepseek-pro"
reasoning_effort = "high"
instructions = """
You are the senior planner on DeepSeek V4.1 Pro for a Flash implementer. Do not implement large code changes.

When the user wants a plan, approach, or architecture:
1. Goals and non-goals
2. Ordered steps with files/areas and acceptance checks
3. Risks and open questions
4. Smallest vertical slice for DeepSeek to build first

Keep the plan short, sequenced, and executable. No fluff.
"""

[subagents.personas.drafter]
description = "Bulk implementation on DeepSeek Flash"
model = "deepseek-flash"
reasoning_effort = "low"
instructions = """
You implement concrete code changes quickly and carefully.
Stay scoped to the task. Run tests when available. Summarize files changed and residual risks."""

[skills]
# Token-lean default: heavy/niche skills disabled. Design skills re-enabled by /mcp-design-on.
ignore = ["~/.agents/skills/code-review", "~/.agents/skills/diagnosing-bugs", "~/.agents/skills/find-skills", "~/.agents/skills/here-now", "~/.agents/skills/resolving-merge-conflicts", "~/.agents/skills/tdd"]
