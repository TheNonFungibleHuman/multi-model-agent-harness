[compat.claude]
skills = false

[compat.cursor]
skills = false

# Design MCPs OFF by default (token-lean). Toggle: /mcp-design-on | /mcp-design-off
# Placeholder paths. Point these at a local Open Design install before enabling the server.
[mcp_servers.open-design]
command = 'C:\Path\To\Open Design\Open Design.exe'
args = [
    'C:\Path\To\Open Design\resources\app\prebundled\daemon\daemon-cli.mjs',
    "mcp",
]
enabled = false

[mcp_servers.open-design.env]
ELECTRON_RUN_AS_NODE = "1"
OD_DATA_DIR = 'C:\Path\To\Open Design Data\namespaces\release-stable-win\data'
OD_SIDECAR_IPC_PATH = '\\.\pipe\open-design-release-stable-win-daemon'
OD_MCP_BOOTSTRAP_COMMAND = 'C:\Path\To\Open Design\Open Design.exe'
OD_MCP_BOOTSTRAP_ARGS = '["--headless"]'

[mcp_servers.paper]
url = "http://127.0.0.1:29979/mcp"
enabled = false

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa"
enabled = true

[model."grok-4.5"]
context_window = 500000

[model."grok-4.6"]
context_window = 500000

[privacy]
privacy_banner_acked = "2026-08-13T11:54:17Z"
