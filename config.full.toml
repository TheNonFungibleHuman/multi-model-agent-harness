paths = []
server_skill_dirs = []
bundled_skill_dirs = []

[compat.claude]
skills = true

[compat.cursor]
skills = true

# Design MCPs OFF by default (token-lean). Toggle: /mcp-design-on | /mcp-design-off
# Placeholder paths. Point these at a local Open Design install before enabling the server.
[mcp_servers.paper]
url = "http://127.0.0.1:29979/mcp"
enabled = false

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa"
enabled = true

# mem0 hosted memory (Agent Mode free tier). The key stays in the user env var
# MEM0_API_KEY; grok expands ${VAR} inside headers. Retrieval policy: one
# search at session start + on demand (see rules/00-token-efficiency.md).
[mcp_servers.mem0]
url = "https://mcp.mem0.ai/mcp"
enabled = true
headers = { "X-API-Key" = "${MEM0_API_KEY}" }

[mcp_servers.pencil]
command = 'C:\Program Files\Pen\resources\app.asar.unpacked\out\mcp-server-windows-x64.exe'
args = ["--app", "desktop"]
enabled = false

[mcp_servers.inspo]
url = "https://inspomcp.dev/api/mcp"
enabled = false

[privacy]
privacy_banner_acked = "2026-08-13T11:54:17Z"
